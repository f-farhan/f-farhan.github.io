# Google analytics ID
google_analytics: G-CB1KWPMQVM

# Location info. (shown in footer)
location: >
  Department of Electrical and Elecctronic Engineering<br/>
  Ahsanullah Universiy of Science and Technology<br/>
  Dhaka<br/>
  Bangladesh<br/>

# Contact info. (shown in footer)
contact: >
    Contact me via email: <a href="mailto:faisalfarhan.eee@aust.edu" target="_blank">faisalfarhan.eee@aust.edu</a><br/>

# Pages shown in navbar
nav_pages:
  - name: about
  - name: publications
    url: p            # label stays "Publications", link is the short URL
  #- name: talks
  - name: research
  - name: education
  #- name: volunteering

# Do you want to group your publications by year? {true/false}
group_pub_by_year: true

# the redirect stubs in publications/ only forward, so keep them out of the sitemap
defaults:
  - scope:
      path: "publications"
    values:
      sitemap: false

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  courses:
    output: true
  publications:
    output: true
    # short URLs: /p/<name>, /p/<name>.pdf. Old /publications/<name> links are
    # redirected by the stubs in publications/, regenerated by the pre-commit hook.
    permalink: /p/:path
  workshops:
    output: true

include:
  - .htaccess
  - _pages

sass:
  sass_dir: _sass

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true # default for kramdown is false. This will enable using Markdown links
